<!DOCTYPE html>
<html>
<head>
    <title>Studenthub - Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
<header>
    <h1>StudentHub</h1>
    <h2>Login</h2>
</header>

<hr>

<form name="myform" action="register.html" method="get" onsubmit="return f()">

    <label>Username</label><br>
    <input type="text" name="uname"><br><br>

    <label>Password</label><br>
    <input type="password" name="pword"><br><br>

    <input type="submit" value="Login">

</form>

<script>
function f() {
    var a = document.forms["myform"];
    var u = a.uname.value;
    var p = a.pword.value;

    if (u == "admin" && p == "1234") {
        alert("Valid Login");
        return true; 
    } else {
        alert("Invalid Login");
        return false; 
    }
}
</script>

</body>
</html>
