<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Event API</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: honeydew;
            text-align: center;
            margin: 20px;
        }

        h1, h2 {
            color: darkgreen;
        }

        input, textarea {
            padding: 10px;
            margin: 7px;
            width: 250px;
        }

        button {
            background-color: darkgreen;
            color: white;
            padding: 9px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 3px;
        }

        button:hover {
            background-color: #2e7d32;
        }

        table {
            width: 95%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 10px;
        }

        th {
            background-color: darkgreen;
            color: white;
        }

        #message {
            font-weight: bold;
        }

        .edit {
            background-color: #1976d2;
        }

        .delete {
            background-color: #c62828;
        }
    </style>
</head>

<body>

<h1>StudentHub</h1>
<h2>Event Management</h2>

<hr>

<p id="message">Loading events...</p>

<h2 id="formHeading">Add New Event</h2>

<form id="eventForm">

    <input type="hidden" id="event_id">

    <input type="text" id="title"
           placeholder="Event Title" required>

    <br>

    <textarea id="description"
              placeholder="Event Description"></textarea>

    <br>

    <input type="date" id="event_date" required>

    <br>

    <input type="text" id="venue"
           placeholder="Event Venue" required>

    <br>

    <button type="submit" id="submitBtn">Add Event</button>

    <button type="button" id="cancelBtn" hidden>
        Cancel Edit
    </button>

</form>

<hr>

<h2>All Events</h2>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Date</th>
            <th>Venue</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody id="eventTable">
        <tr>
            <td colspan="6">Loading...</td>
        </tr>
    </tbody>
</table>

<script>

const API_URL = "events_api.php";

let csrfToken = "";

// Display messages
function showMessage(message, success = true) {
    const msg = document.getElementById("message");
    msg.textContent = message;
    msg.style.color = success ? "darkgreen" : "red";
}

// Send requests to PHP API
async function apiRequest(method, data = null) {

    const options = {
        method: method,
        credentials: "same-origin"
    };

    if (data !== null) {
        options.headers = {
            "Content-Type": "application/json"
        };

        options.body = JSON.stringify({
            ...data,
            csrf_token: csrfToken
        });
    }

    const response = await fetch(API_URL, options);
    const result = await response.json();

    if (!response.ok || !result.success) {
        throw new Error(result.message || "Request failed.");
    }

    return result;
}

// Create table cell safely
function addCell(row, value) {
    const cell = document.createElement("td");
    cell.textContent = value ?? "";
    row.appendChild(cell);
}

// Display all events
async function loadEvents() {

    try {
        const result = await apiRequest("GET");

        csrfToken = result.data.csrf_token;

        const table = document.getElementById("eventTable");
        table.replaceChildren();

        const events = result.data.events;

        if (events.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 6;
            cell.textContent = "No events available.";

            row.appendChild(cell);
            table.appendChild(row);
            return;
        }

        events.forEach(event => {

            const row = document.createElement("tr");

            addCell(row, event.event_id);
            addCell(row, event.title);
            addCell(row, event.description);
            addCell(row, event.event_date);
            addCell(row, event.venue);

            const actionCell = document.createElement("td");

            // Edit button
            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.className = "edit";

            editButton.addEventListener("click", () => {
                editEvent(event);
            });

            actionCell.appendChild(editButton);

            // Delete button
            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";

            deleteButton.addEventListener("click", () => {
                deleteEvent(event.event_id);
            });

            actionCell.appendChild(deleteButton);

            row.appendChild(actionCell);
            table.appendChild(row);
        });

    } catch (error) {
        showMessage(error.message, false);
    }
}

// Add or update event
document.getElementById("eventForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const id = document.getElementById("event_id").value;

        const eventData = {
            title: document.getElementById("title").value.trim(),
            description: document.getElementById("description").value.trim(),
            event_date: document.getElementById("event_date").value,
            venue: document.getElementById("venue").value.trim()
        };

        try {

            if (id === "") {
                await apiRequest("POST", eventData);
                showMessage("Event added successfully!");
            } else {
                await apiRequest("PUT", {
                    event_id: id,
                    ...eventData
                });

                showMessage("Event updated successfully!");
            }

            resetForm();
            await loadEvents();

        } catch (error) {
            showMessage(error.message, false);
        }
    });

// Load event details into form for editing
function editEvent(event) {

    document.getElementById("event_id").value = event.event_id;
    document.getElementById("title").value = event.title;
    document.getElementById("description").value = event.description ?? "";
    document.getElementById("event_date").value = event.event_date;
    document.getElementById("venue").value = event.venue;

    document.getElementById("formHeading").textContent = "Update Event";
    document.getElementById("submitBtn").textContent = "Update Event";
    document.getElementById("cancelBtn").hidden = false;

    window.scrollTo(0, 0);
}

// Delete event
async function deleteEvent(id) {

    if (!confirm("Are you sure you want to delete this event?")) {
        return;
    }

    try {

        await apiRequest("DELETE", {
            event_id: id
        });

        showMessage("Event deleted successfully!");
        await loadEvents();

    } catch (error) {
        showMessage(error.message, false);
    }
}

// Reset form
function resetForm() {

    document.getElementById("eventForm").reset();
    document.getElementById("event_id").value = "";

    document.getElementById("formHeading").textContent = "Add New Event";
    document.getElementById("submitBtn").textContent = "Add Event";
    document.getElementById("cancelBtn").hidden = true;
}

document.getElementById("cancelBtn")
    .addEventListener("click", resetForm);

// Load events when page opens
loadEvents();

</script>

</body>
</html>
