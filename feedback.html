<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Feedback</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: honeydew;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }

        header {
            text-align: center;
        }

        h1, h2 {
            color: darkgreen;
        }

        main {
            width: 100%;
            padding: 15px;
        }

        section {
            max-width: 500px;
            margin: auto;
        }

        h2 {
            text-align: center;
        }

        form {
            background-color: white;
            border: 2px solid darkgreen;
            border-radius: 8px;
            padding: 25px;
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: darkgreen;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #888;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        input[type="submit"] {
            background-color: darkgreen;
            color: white;
            padding: 11px 22px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #2e7d32;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            main {
                padding: 10px 0;
            }

            form {
                padding: 18px;
            }

            h1 {
                font-size: 26px;
            }

            h2 {
                font-size: 21px;
            }

            input[type="submit"] {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>StudentHub</h1>
    <hr>
</header>

<main>

    <section>

        <h2>Feedback</h2>

        <form>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="feedback">Your Feedback:</label>
            <textarea id="feedback" name="feedback"
                      rows="5" required></textarea>

            <input type="submit" value="Submit">

        </form>

    </section>

</main>

<hr>

</body>
</html>
