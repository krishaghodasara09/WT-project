<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Register</title>

    <link rel="stylesheet" href="register.css">

    <script>
    function validateform() {

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value;
        let Rollno = document.getElementById("Rollno").value.trim();

        let pwdtest = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{6,}$/;
        let rolltest = /^[0-9]{2}aiml[0-9]{3}$/;

        if (!rolltest.test(Rollno)) {
            alert("Enter Valid ID");
            return false;
        }

        if (name == "") {
            alert("Please enter your name");
            return false;
        }

        if (email == "") {
            alert("Please enter your email");
            return false;
        }

        if (!pwdtest.test(password)) {
            alert("Password must have 1 uppercase, 1 lowercase, 1 digit, and minimum length of 6");
            return false;
        }

        return true;
    }
    </script>
</head>

<body>

    <header>
        <h1>StudentHub</h1>
        <h2>Register</h2>
    </header>

    <main>

        <form action="register.php" method="POST" onsubmit="return validateform()">

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required><br><br>

            <label for="Rollno">ID:</label><br>
            <input type="text" id="Rollno" name="Rollno"
                   placeholder="Enter your ID" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required><br><br>

            <label for="course">Course:</label><br>
            <input type="text" id="course" name="course"
                   placeholder="Enter your course" required><br><br>

            <input type="submit" value="Register">

        </form>

    </main>

    <hr>

</body>
</html>
